name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
            ripgrep_asset: ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
            ripgrep_sha256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
          - name: windows
            host: windows-2025
            ripgrep_asset: ripgrep-15.2.0-x86_64-pc-windows-msvc.zip
            ripgrep_sha256: 71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache ripgrep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ripgrep-download/${{ matrix.settings.ripgrep_asset }}
          key: ripgrep-${{ runner.os }}-${{ runner.arch }}-${{ matrix.settings.ripgrep_sha256 }}

      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        env:
          RIPGREP_ASSET: ${{ matrix.settings.ripgrep_asset }}
          RIPGREP_SHA256: ${{ matrix.settings.ripgrep_sha256 }}
        run: |
          download="$RUNNER_TEMP/ripgrep-download"
          archive="$download/$RIPGREP_ASSET"
          mkdir -p "$download"
          if [ ! -f "$archive" ] || ! echo "$RIPGREP_SHA256  $archive" | sha256sum --check --strict; then
            rm -f "$archive"
            curl --fail --location --retry 3 --output "$archive.part" \
              "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/$RIPGREP_ASSET"
            echo "$RIPGREP_SHA256  $archive.part" | sha256sum --check --strict
            mv "$archive.part" "$archive"
          fi
          root="$RUNNER_TEMP/ripgrep-15.2.0"
          bin="$root/ripgrep-15.2.0-x86_64-unknown-linux-musl"
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RIPGREP_ASSET: ${{ matrix.settings.ripgrep_asset }}
          RIPGREP_SHA256: ${{ matrix.settings.ripgrep_sha256 }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP "ripgrep-download"
          $archive = Join-Path $download $env:RIPGREP_ASSET
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          $actual = if (Test-Path $archive) { (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() } else { "" }
          if ($actual -ne $env:RIPGREP_SHA256) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            $partial = "$archive.part"
            Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/$env:RIPGREP_ASSET" -OutFile $partial -MaximumRetryCount 3 -RetryIntervalSec 2
            $actual = (Get-FileHash -Algorithm SHA256 $partial).Hash.ToLowerInvariant()
            if ($actual -ne $env:RIPGREP_SHA256) { throw "ripgrep checksum mismatch: expected $env:RIPGREP_SHA256, got $actual" }
            Move-Item -LiteralPath $partial -Destination $archive -Force
          }
          $root = Join-Path $env:RUNNER_TEMP "ripgrep-15.2.0"
          $bin = Join-Path $root "ripgrep-15.2.0-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Configure Bun runtime transpiler cache (Windows)
        if: runner.os == 'Windows'
        run: echo "BUN_RUNTIME_TRANSPILER_CACHE_PATH=$RUNNER_TEMP/bun-runtime-transpiler-cache" >> "$GITHUB_ENV"

      - name: Prewarm Bun runtime transpiler cache (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/opencode
        run: bun test test/plugin/loader.test.ts --test-name-pattern "loads a file:// plugin function export"
        timeout-minutes: 2

      - name: Run unit tests
        run: bun turbo test:ci
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Publish unit reports
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: packages/*/.artifacts/unit/junit.xml
          check_name: "unit results (${{ matrix.settings.name }})"
          detailed_summary: true
          include_time_in_summary: true
          fail_on_failure: false

      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-${{ matrix.settings.name }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: packages/*/.artifacts/unit/junit.xml

  e2e:
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
          - name: windows
            host: windows-2025
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT: e2e/junit-${{ matrix.settings.name }}.xml
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/junit-*.xml
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
