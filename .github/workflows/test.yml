name: test

# Scratch source only. Root dispatches this registered path exactly once after review.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: Windows one-off phase measurement
    if: github.ref == 'refs/heads/test/windows-unit-phase-measurement-r1018'
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
      GITHUB_ACTIONS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - name: Setup Bun
        timeout-minutes: 10
        uses: ./.github/actions/setup-bun

      - name: Cache ripgrep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ripgrep-download/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip
          key: ripgrep-${{ runner.os }}-${{ runner.arch }}-71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5

      - name: Install ripgrep (Windows)
        shell: pwsh
        env:
          RIPGREP_ASSET: ripgrep-15.2.0-x86_64-pc-windows-msvc.zip
          RIPGREP_SHA256: 71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5
        run: |
          $download = Join-Path $env:RUNNER_TEMP "ripgrep-download"
          $archive = Join-Path $download $env:RIPGREP_ASSET
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          $actual = if (Test-Path $archive) { (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() } else { "" }
          if ($actual -ne $env:RIPGREP_SHA256) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            $partial = "$archive.part"
            Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/$env:RIPGREP_ASSET" -OutFile $partial -MaximumRetryCount 3 -RetryIntervalSec 2
            $actual = (Get-FileHash -Algorithm SHA256 $partial).Hash.ToLowerInvariant()
            if ($actual -ne $env:RIPGREP_SHA256) { throw "ripgrep checksum mismatch: expected $env:RIPGREP_SHA256, got $actual" }
            Move-Item -LiteralPath $partial -Destination $archive -Force
          }
          $root = Join-Path $env:RUNNER_TEMP "ripgrep-15.2.0"
          $bin = Join-Path $root "ripgrep-15.2.0-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Verify required ripgrep and prepare evidence
        id: setup
        shell: pwsh
        run: |
          $rg = Get-Command rg -ErrorAction Stop
          & $rg.Source --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $logs = Join-Path $env:RUNNER_TEMP "windows-phase-r1018"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          foreach ($mode in @("cold", "preimport", "opencode")) {
            "not-started" | Set-Content (Join-Path $logs "$mode.status.txt")
          }

      - name: Measure cold once
        id: cold
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 3
        working-directory: packages/core
        shell: pwsh
        env:
          OPENCODE_VERTEX_ANTHROPIC_PHASES: "1"
          OPENCODE_VERTEX_ANTHROPIC_PREIMPORT: "0"
          OPENCODE_WINDOWS_UNIT_DIAGNOSTICS: "0"
        run: |
          $logs = Join-Path $env:RUNNER_TEMP "windows-phase-r1018"
          $status = Join-Path $logs "cold.status.txt"
          "started; exit=unavailable" | Set-Content $status
          $process = Start-Process -FilePath (Get-Command bun -ErrorAction Stop).Source `
            -ArgumentList "test ./test/plugin/provider-google-vertex-anthropic.test.ts" -WorkingDirectory $PWD.Path -PassThru -NoNewWindow `
            -RedirectStandardOutput (Join-Path $logs "cold.stdout.log") `
            -RedirectStandardError (Join-Path $logs "cold.stderr.log")
          $null = $process.Handle
          if (!$process.WaitForExit(120000)) {
            "watchdog-timeout; exit=unavailable" | Set-Content $status
            $process.Kill($true)
            if ($process.WaitForExit(5000)) {
              "watchdog-timeout; exit=$($process.ExitCode)" | Set-Content $status
            }
            exit 1
          }
          $code = $process.ExitCode
          # Bound redirected-stream drain as well as execution; never use WaitForExit().
          $drained = $process.WaitForExitAsync().Wait(5000)
          "exited; exit=$code; drained=$drained" | Set-Content $status
          if (!$drained) { exit 1 }
          exit $code

      - name: Measure preimport once
        id: preimport
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 3
        working-directory: packages/core
        shell: pwsh
        env:
          OPENCODE_VERTEX_ANTHROPIC_PHASES: "1"
          OPENCODE_VERTEX_ANTHROPIC_PREIMPORT: "1"
          OPENCODE_WINDOWS_UNIT_DIAGNOSTICS: "0"
        run: |
          $logs = Join-Path $env:RUNNER_TEMP "windows-phase-r1018"
          $status = Join-Path $logs "preimport.status.txt"
          "started; exit=unavailable" | Set-Content $status
          $process = Start-Process -FilePath (Get-Command bun -ErrorAction Stop).Source `
            -ArgumentList "test ./test/plugin/provider-google-vertex-anthropic.test.ts" -WorkingDirectory $PWD.Path -PassThru -NoNewWindow `
            -RedirectStandardOutput (Join-Path $logs "preimport.stdout.log") `
            -RedirectStandardError (Join-Path $logs "preimport.stderr.log")
          $null = $process.Handle
          if (!$process.WaitForExit(120000)) {
            "watchdog-timeout; exit=unavailable" | Set-Content $status
            $process.Kill($true)
            if ($process.WaitForExit(5000)) {
              "watchdog-timeout; exit=$($process.ExitCode)" | Set-Content $status
            }
            exit 1
          }
          $code = $process.ExitCode
          # Bound redirected-stream drain as well as execution; never use WaitForExit().
          $drained = $process.WaitForExitAsync().Wait(5000)
          "exited; exit=$code; drained=$drained" | Set-Content $status
          if (!$drained) { exit 1 }
          exit $code

      - name: Measure opencode once
        id: opencode
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: packages/opencode
        shell: pwsh
        env:
          OPENCODE_VERTEX_ANTHROPIC_PHASES: "0"
          OPENCODE_VERTEX_ANTHROPIC_PREIMPORT: "0"
          OPENCODE_WINDOWS_UNIT_DIAGNOSTICS: "1"
        run: |
          $logs = Join-Path $env:RUNNER_TEMP "windows-phase-r1018"
          $status = Join-Path $logs "opencode.status.txt"
          "started; exit=unavailable" | Set-Content $status
          $process = Start-Process -FilePath (Get-Command bun -ErrorAction Stop).Source `
            -ArgumentList "run test" -WorkingDirectory $PWD.Path -PassThru -NoNewWindow `
            -RedirectStandardOutput (Join-Path $logs "opencode.stdout.log") `
            -RedirectStandardError (Join-Path $logs "opencode.stderr.log")
          $null = $process.Handle
          if (!$process.WaitForExit(1180000)) {
            "watchdog-timeout; exit=unavailable" | Set-Content $status
            $process.Kill($true)
            if ($process.WaitForExit(5000)) {
              "watchdog-timeout; exit=$($process.ExitCode)" | Set-Content $status
            }
            exit 1
          }
          $code = $process.ExitCode
          # Bound redirected-stream drain as well as execution; never use WaitForExit().
          $drained = $process.WaitForExitAsync().Wait(5000)
          "exited; exit=$code; drained=$drained" | Set-Content $status
          if (!$drained) { exit 1 }
          exit $code

      - name: Record step outcomes and bound retained logs
        if: always()
        shell: pwsh
        timeout-minutes: 2
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          PREIMPORT_OUTCOME: ${{ steps.preimport.outcome }}
          OPENCODE_OUTCOME: ${{ steps.opencode.outcome }}
        run: |
          $logs = Join-Path $env:RUNNER_TEMP "windows-phase-r1018"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          @("setup=$env:SETUP_OUTCOME", "cold=$env:COLD_OUTCOME", "preimport=$env:PREIMPORT_OUTCOME", "opencode=$env:OPENCODE_OUTCOME") | Set-Content (Join-Path $logs "steps.status.txt")
          # Keep a bounded tail per stream; record original size if truncation is needed.
          foreach ($file in Get-ChildItem $logs -Filter "*.log") {
            if ($file.Length -le 16MB) { continue }
            "$($file.Name): original_bytes=$($file.Length); retained_tail_bytes=16777216" | Add-Content (Join-Path $logs "truncation.status.txt")
            $stream = [System.IO.File]::OpenRead($file.FullName)
            try {
              [void]$stream.Seek(-16MB, [System.IO.SeekOrigin]::End)
              $buffer = [byte[]]::new(16MB)
              $stream.ReadExactly($buffer)
            } finally {
              $stream.Dispose()
            }
            [System.IO.File]::WriteAllBytes($file.FullName, $buffer)
          }

      - name: Upload Windows measurement evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-phase-r1018-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-phase-r1018
          if-no-files-found: warn
          retention-days: 7
